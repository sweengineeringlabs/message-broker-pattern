[package]
name         = "message-broker-pattern-core"
version      = "0.1.0"
edition      = "2021"
license      = "MIT OR Apache-2.0"
authors      = ["SWE Engineering Labs"]
repository   = "https://github.com/sweengineeringlabs/message-broker-pattern"
rust-version = "1.98"
description  = "This pattern's own default implementation: NoopMessageBroker/NoopValidator, with no named external technology dependency. A technology-specific backend (NATS, Kafka, Postgres) belongs in a downstream consumer's own spi crate instead."
keywords     = ["message-broker", "pubsub", "core", "swe"]
categories   = ["network-programming", "asynchronous"]

[package.metadata.arch]
application_type = "adapter"
service_type     = "message-broker"

[lib]
name = "message_broker_pattern_core"
path = "src/lib.rs"

[dependencies]
message-broker-pattern-contract = { version = "0.1.0", path = "../contract" }
configbuilder                   = "0.8"
futures                         = "0.3"
serde                           = { version = "1.0", features = ["derive"] }

[dev-dependencies]
tempfile = "3.27"

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
