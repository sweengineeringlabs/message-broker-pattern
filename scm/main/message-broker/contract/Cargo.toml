[package]
name         = "message-broker-pattern-contract"
version      = "0.1.0"
edition      = "2021"
license      = "MIT OR Apache-2.0"
authors      = ["SWE Engineering Labs"]
repository   = "https://github.com/sweengineeringlabs/message-broker-pattern"
rust-version = "1.98"
description  = "Generic, domain-agnostic message-broker contract: MessageBroker/Validator trait shapes + Message/BackendKind/*Request/*Response types. Zero implementation -- see message-broker-pattern-core for this pattern's own default implementation. Extracted from edge-message-broker (edge-message-broker#6)."
keywords     = ["message-broker", "pubsub", "contract", "swe"]
categories   = ["network-programming", "asynchronous"]

[package.metadata.arch]
application_type = "port"
service_type     = "message-broker"

[lib]
name = "message_broker_pattern_contract"
path = "src/lib.rs"

[dependencies]

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
