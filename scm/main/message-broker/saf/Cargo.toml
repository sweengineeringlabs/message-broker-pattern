[package]
name         = "message-broker-pattern-saf"
version      = "0.1.0"
edition      = "2021"
license      = "MIT OR Apache-2.0"
authors      = ["SWE Engineering Labs"]
repository   = "https://github.com/sweengineeringlabs/message-broker-pattern"
rust-version = "1.98"
description  = "Facade for message-broker-pattern -- the recommended entry point for consumers. Wires message-broker-pattern-core's default implementation behind message-broker-pattern-contract's traits; a downstream consumer's own saf constructs its technology-specific spi implementations the same way."
keywords     = ["message-broker", "pubsub", "facade", "swe"]
categories   = ["network-programming", "asynchronous"]

[package.metadata.arch]
application_type = "facade"
service_type     = "message-broker"

[lib]
name = "message_broker_pattern_saf"
path = "src/lib.rs"

[dependencies]
message-broker-pattern-contract = { version = "0.1.0", path = "../contract" }
message-broker-pattern-core     = { version = "0.1.0", path = "../core" }
configbuilder                   = "0.8"

[dev-dependencies]
tokio   = { version = "1.52", features = ["rt-multi-thread", "macros"] }
futures = "0.3"

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
